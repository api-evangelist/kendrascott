name: Kendra Scott
description: 'Kendra Scott is an American jewelry and accessories retailer founded in 2002 in Austin,
  Texas, offering personalized jewelry, watches, home goods, and gifts through customization options
  such as initials, birthstones, and engraving. The brand operates a direct-to-consumer ecommerce
  storefront alongside a network of retail stores, and pairs its Color Bar customization experience
  with a philanthropic giving model tied to purchases. Surfaced as a portfolio company of
  norwest-venture-partners and added to the API Evangelist network; the company publishes a consumer
  ecommerce site but no public developer API, SDK, or developer portal at this time. This profile
  captures its public identity and web-property surface pending any future developer program.'
